# Создайте файл admin/.env по образцу admin/.env.example и заполните значения.
# Для Docker передайте переменные через env_file или environment ниже.

services:
  web:
    build: .
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
    env_file:
      - ./admin/.env
    restart: unless-stopped

